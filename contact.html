    <body>
       <header class="site-header" width="1920">
            <a href="index.html"><img src="Kingsmanevents1.5.jpg" class="logo" width="350" alt></a>
        </header>
        <div id="mySidebar" class="sidebar">
          <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="events.html">Events</a>
          <a href="gallery.html">Gallery</a>
          <a href="contact.html">Contact</a>
        </div>

        <div id="main">
          <button class="openbtn" onclick="openNav()">&#9776; Menu</button>
        </div>
        <script src="script.js"></script>

        <script>
        function openNav() {
          document.getElementById("mySidebar").style.width = "250px";
          document.getElementById("main").style.marginLeft = "250px";
        }

        function closeNav() {
          document.getElementById("mySidebar").style.width = "0";
          document.getElementById("main").style.marginLeft = "0";
        }
        </script>
        <br>
        <br>
        <br>
        <br>
        <div class="container">
            <form action="https://formsubmit.co/kingsman.events101@gmail.com" method="POST" >

                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fullname" placeholder="Full Name">

                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" placeholder="Email Address" required>

                <label for="phone">Phone Number</label>
                <input type="text" id="phone" name="phone" placeholder="Phone number" required>
            

                <label for="city">City</label>
                <select id="city" name="city">
                    <option value="...">...</option>
                    <option value="Glasgow">Glasgow</option>
                    <option value="Edinburgh">Edinburgh</option>
                    <option value="London">London</option>
                </select>

                <label for="event">Event</label>
                <select id="event" name="event">
                    <option value="...">...</option>
                    <option value="Sport">Sport</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Private">Private</option>
                    <option value="Corporate">Corporate</option>
                    <option value="Parties">Parties</option>
                    <option value="Charity">Charity</option>
                </select>

                <label for="subject">Subject</label>
                <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px"></textarea>

                <input type="submit" value="Submit">

            </form>
        </div>
        <br>
        <br>
        <br>

        <br>
        <br>
    </body>
